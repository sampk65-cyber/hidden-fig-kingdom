<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>隱花之巔・城堡入口測試</title><link rel="stylesheet" href="castle/castle.css"><script src="castle/core.js"></script><script src="castle/castle.js"></script><style>body{margin:0;background:#0a1822;color:#e8d8b8;font:16px system-ui,sans-serif}.preview{max-width:440px;margin:auto;padding:25px 18px}h1{font-size:24px}p{line-height:1.8;color:#b6c7ca}#mapSvg{background:linear-gradient(#7dabbc,#c7d2c0);border-radius:20px}svg{width:100%;display:block}#toast{position:fixed;bottom:20px;left:10%;right:10%;background:#142b35ee;padding:14px;text-align:center;border-radius:12px;pointer-events:none}button{min-height:44px}.preview-tools{display:flex;gap:8px;margin:12px 0}.preview-tools button{flex:1}small{color:#c1a774}</style></head><body><main class="preview"><small>獨立測試・不連線玩家資料</small><h1>隱花之巔城堡</h1><p>點入口雕像，領取並輸入一次性密語。<br>再點雕像五下 → 過橋 → 畫 X → 迎賓影片。</p><div class="preview-tools"><button id="reset">重設首次驗證</button><button id="rank">目前：第 1 名</button></div><div class="preview-tools" style="position:relative;z-index:1900"><button id="sound">音效：開</button><button id="account">帳號：A</button></div><div id="mapSvg"></div></main><div id="toast" role="status">點吊橋入口旁的守護雕像</div><script>
let verified=false,issued='',used=false,rank=1,sound=true,account='A';const map=document.getElementById('mapSvg');
function render(){map.innerHTML=`<svg viewBox="0 90 360 170"><defs><linearGradient id="isle" x2="0" y2="1"><stop stop-color="#78a273"/><stop offset="1" stop-color="#5a756d"/></linearGradient></defs><path d="M210 200Q230 160 270 178L290 211L255 249L220 225Z" fill="url(#isle)"/><path d="M285 140L293 112L335 108L354 135L331 165L300 160Z" fill="url(#isle)"/><path d="M273 186Q298 166 310 132" stroke="#67452d" stroke-width="9" fill="none"/><path d="M273 186Q298 166 310 132" stroke="#c6a16c" stroke-width="7" stroke-dasharray="2 1" fill="none"/><path d="M270 181Q293 164 307 126M276 182Q301 162 313 126" fill="none" stroke="#664c36"/><g fill="#e8d7af" stroke="#a88f62"><path d="M301 130V106L308 98L315 106V115H330V104L337 97L344 104V133Z"/><path d="M315 115V100L324 92L332 100V132H315Z"/></g><path d="M319 132V121Q324 114 329 121V132Z" fill="#203b3d"/>${Castle.marker()}<g id="mapMe" transform="translate(250 216)"><circle cy="-12" r="5" fill="#ffe6ac"/><path d="M-4-6L-5 4H5L4-6Z" fill="#8a4368"/></g></svg>`;Castle.bind()}
Castle.configure({toast:s=>document.getElementById('toast').textContent=s,themeSync(){},restoreMap:render,sound:()=>sound,identity:()=>account,async call(op,d){await new Promise(r=>setTimeout(r,80));if(rank>3){if(op==='status')return {eligible:false};throw Error('僅開放前三名')}if(op==='status')return {eligible:true,verified,rank};if(op==='issue'){issued='628517';used=false;return {code:issued,rank}}if(op==='verify'){if(used)throw Error('密語已使用');if(d.code!==issued||!issued)throw Error('密語不正確');verified=true;used=true;return {ok:true}}if(op==='enter'){if(!verified)throw Error('請先驗證');return {ok:true,rank,name:'王國守護者'}}},bridge(p){const q=Math.max(0,(p-.3)/.7);document.getElementById('mapMe')?.setAttribute('transform',`translate(${273+37*q} ${186-54*q})`)}});
document.getElementById('reset').onclick=()=>{Castle.close();verified=false;issued='';used=false;render()};document.getElementById('rank').onclick=e=>{Castle.close();rank=rank===1?4:1;e.target.textContent='目前：第 '+rank+' 名'};document.getElementById('sound').onclick=e=>{sound=!sound;e.target.textContent='音效：'+(sound?'開':'關')};document.getElementById('account').onclick=e=>{account=account==='A'?'B':'A';e.target.textContent='帳號：'+account};render();
</script></body></html>
