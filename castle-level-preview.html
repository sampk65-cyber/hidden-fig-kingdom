<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>流光晶塔 · 隔離互動預覽</title><link rel="stylesheet" href="castle/castle.css?v=15.21t3"><link rel="stylesheet" href="castle/level.css?v=15.21t3"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script><script src="castle/level-core.js?v=15.21t3"></script><script src="castle/vip.js?v=15.21t3"></script><script src="castle/touch-core.js?v=15.21t3"></script><script src="castle/touch-scene.js?v=15.21t3"></script><script src="castle/level.js?v=15.21t3"></script><style>
[hidden]{display:none!important}html,body{margin:0;min-height:100%;background:#162820;font:14px system-ui,sans-serif;color:#e5d9b8}*{box-sizing:border-box}button,input,textarea{font:inherit}button{cursor:pointer;min-height:35px}#previewBar{position:fixed;top:0;left:0;right:0;height:44px;display:flex;align-items:center;gap:6px;padding:5px 10px;background:#10281feF;z-index:10050;border-bottom:1px solid #c6b37b66;font-size:10px}#previewBar>b{margin-right:auto;font-weight:500;color:#cfbd86}#previewBar button{background:transparent;color:#d9c99e;border:1px solid #a8a47766;border-radius:5px;padding:4px 9px;font-size:10px;min-height:29px}#castleOv{top:44px;z-index:2}#page{max-width:700px;background:#f6f2e7;color:#304638;margin:70px auto 30px;padding:25px;border-radius:16px}.preview-phone #castleOv{left:50%;right:auto;transform:translateX(-50%);width:390px;max-width:100vw;box-shadow:0 0 45px #0007}.hide{display:none!important}.field{width:100%;padding:10px 12px;border:1px solid #c9c8b7;border-radius:7px;background:#fffdf6;margin:6px 0 8px;box-sizing:border-box;color:#344a3a}.card{background:#fffdf7;border:1px solid #dfd8c3;border-radius:12px;padding:18px;margin:14px 0}.btn{display:block;width:100%;padding:12px 15px;border:1px solid #a6b396;border-radius:7px;margin-top:10px;background:#edf0e3;color:#354f38}.btn.main{background:#2a573e;color:#fff3cf}.chip{border:1px solid #bfbea7;border-radius:20px;background:#fffdf5;padding:5px 10px;color:#476342}.lvtxt,.sub{font-size:12px;line-height:1.8;color:#7a806b}#toast{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);padding:10px 20px;border:1px solid #baa76c;background:#15352de8;border-radius:7px;z-index:10060;pointer-events:none;font-size:11px;max-width:85%;text-align:center}#demoNotice{font-size:11px;line-height:1.8;color:#7a775f;background:#f5ead0;padding:12px;border-radius:7px;margin-bottom:18px}@media(max-width:600px){#previewBar>b{max-width:100px;font-size:8px}#previewBar button{padding:4px 6px;font-size:9px}#page{margin:54px 10px 20px;padding:15px}}
</style></head><body><div id="previewBar"><b>隔離預覽 · 全部為模擬資料</b><button id="play">第一關</button><button id="cards">我的卡</button><button id="admin">獎項後台</button><button id="phone">手機寬度</button><button id="account">會員 A</button><button id="reset">重設</button></div><div id="castleOv" class="castle-level"></div><main id="page" hidden></main><div id="toast" role="status">此頁不連線 Firebase，不產生正式獎項。</div><script>
'use strict';const C=CastleLevelCore,storageKey='hfk-summit-isolated-preview-v15.21-touch3';let data;try{data=JSON.parse(localStorage.getItem(storageKey)||'null')}catch(_){}if(!data)data={sessions:{},cards:[],limit:100,prizeName:'',prizeNote:''};let account='A',mode='game',controller=null;const game=document.getElementById('castleOv'),page=document.getElementById('page');
const me=()=>({memberNo:'DEMO-'+account,name:account==='A'?'示範守護者':'示範小呱',role:account==='A'?'hero':'cat',avatarUrl:'art/chars/'+(account==='A'?'hero':'cat')+'.webp',points:300});
function save(){localStorage.setItem(storageKey,JSON.stringify(data))}function toast(t){document.getElementById('toast').textContent=t}function session(){return data.sessions[account]}function publicState(){return {...structuredClone(session()),serverNow:Date.now()}}function card(){return data.cards.find(c=>c.memberNo===me().memberNo)}
async function call(op,body={}){const owner=account;await new Promise(r=>setTimeout(r,70));if(owner!==account)throw Error('示範帳號已切換，請重新開啟。');const t=Date.now();try{data=JSON.parse(localStorage.getItem(storageKey))||data}catch(_){}
 if(op==='myCards')return {cards:data.cards.filter(c=>c.memberNo===me().memberNo),levels:[level()]};
 if(op==='startLevel'){if(!session()||(body.restart===true&&session().complete)){data.sessions[account]={sid:'DEMO-'+account+'-'+t,levelId:C.LEVEL.id,seq:0,...CastleTouch.create()}}save();return {session:publicState(),card:card()}}
 const s=session();if(!s)throw Error('請先開始關卡。');
 if(op==='turnDial'||op==='enterStairs'){if(s.sid!==body.sid)throw Error('請重新同步');if(body.seq<=s.seq)return {session:publicState(),card:card()};if(body.seq!==s.seq+1)throw Error('步驟已更新');const next=op==='turnDial'?CastleTouch.turn(s,body.direction):CastleTouch.enter(s);next.seq=s.seq+1;data.sessions[account]=next;if(next.complete)issue();save();return {session:publicState(),card:card(),soldOut:next.complete&&!card()}}
 if(op==='claimCard'){if(!s.complete)throw Error('尚未完成');issue();save();return {session:publicState(),card:card(),soldOut:!card()}}throw Error('示範操作不支援');
}
function issue(){if(card()||data.cards.length>=data.limit)return;const m=me(),n=data.cards.length+1;data.cards.push({id:'demo-tower-'+account,levelId:C.LEVEL.id,levelTitle:C.LEVEL.title,thumbnail:C.LEVEL.thumbnail,serialNumber:n,serial:'DEMO-T01-'+String(n).padStart(3,'0'),editionLimit:data.limit,memberNo:m.memberNo,name:m.name,role:m.role,points:m.points,issuedAt:Date.now(),prize:{name:'',note:'',status:'pending'}})}
function level(){return {id:C.LEVEL.id,title:C.LEVEL.title,thumbnail:C.LEVEL.thumbnail,limit:data.limit,issued:data.cards.length,prizeName:data.prizeName,prizeNote:data.prizeNote}}
async function adminCall(op,b={}){await new Promise(r=>setTimeout(r,70));try{data=JSON.parse(localStorage.getItem(storageKey))||data}catch(_){}if(op==='adminOverview')return {cards:structuredClone(data.cards),levels:[level()]};if(op==='adminSaveLevel'){if(!Number.isInteger(b.limit)||b.limit<data.cards.length)throw Error('不能低於已發卡數');data.limit=b.limit;data.prizeName=b.prizeName;data.prizeNote=b.prizeNote;save();return {level:level()}}const c=data.cards.find(c=>c.id===b.cardId);if(!c)throw Error('示範卡不存在');if(op==='adminAssignPrize'){if(c.prize.status==='redeemed')throw Error('此獎項已兌換');c.prize={name:b.name,note:b.note,status:'ready',assignedAt:Date.now()};save();return {card:c}}if(op==='adminRedeem'){if(c.prize.status!=='ready')throw Error('無法重複兌換');c.prize.status='redeemed';c.prize.redeemedAt=Date.now();save();return {card:c}}throw Error('示範操作不支援')}
CastleVIP.configure({member:me,identity:()=>me().memberNo,authIdentity:()=>mode==='admin'?'DEMO-ADMIN':me().memberNo,adminVisible:()=>mode==='admin'&&!document.hidden,call,adminCall,toast});
function show(next){controller?.dispose();controller=null;CastleVIP.disposeAdmin();mode=next;game.hidden=next!=='game';page.hidden=next==='game';page.innerHTML='<div id="demoNotice">隔離功能預覽：全部會員、VIP 卡、限量編號與獎項都是模擬資料，不可用來兌換正式獎項。</div><div id="previewContent"></div>';if(next==='game'){game.innerHTML='';const levelHost=document.createElement('div');game.appendChild(levelHost);controller=CastleLevel.mount(levelHost,{call,member:me,identity:()=>me().memberNo,isAlive:()=>mode==='game',sound:()=>false,toast,onCardsChanged:()=>CastleVIP.invalidate()})}else if(next==='cards')CastleVIP.shelf(document.getElementById('previewContent'),{force:true});else CastleVIP.admin(document.getElementById('previewContent'))}
document.getElementById('play').onclick=()=>show('game');document.getElementById('cards').onclick=()=>show('cards');document.getElementById('admin').onclick=()=>show('admin');document.getElementById('phone').onclick=()=>document.body.classList.toggle('preview-phone');document.getElementById('account').onclick=e=>{account=account==='A'?'B':'A';e.currentTarget.textContent='會員 '+account;CastleVIP.invalidate();show(mode)};document.getElementById('reset').onclick=()=>{data={sessions:{},cards:[],limit:100,prizeName:'',prizeNote:''};save();CastleVIP.invalidate();show('game')};show('game');
</script></body></html>
